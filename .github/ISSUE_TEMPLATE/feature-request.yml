name: Feature Request
description: Suggest a new feature or enhancement for the QA pipeline
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: dropdown
    id: skill
    attributes:
      label: Related Skill
      description: Which skill does this relate to?
      options:
        - Skill 1: Requirement Analysis
        - Skill 2: Exploratory Testing
        - Skill 3: Playwright Capture
        - Skill 4: Test Generation
        - Skill 5: Test Execution
        - Skill 6: Reporting
        - Orchestrator
        - Memory System
        - Adapter (new agent runtime)
        - Other
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches?
    validations:
      required: false
